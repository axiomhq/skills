name: Test cost-control scripts

on:
  pull_request:
    paths:
      - 'skills/controlling-costs/**'
      - '.github/workflows/test-cost-control.yml'
  push:
    branches: [main]
    paths:
      - 'skills/controlling-costs/**'
      - '.github/workflows/test-cost-control.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq bc
      - run: python3 -m unittest discover -s skills/controlling-costs/tests -v
      - run: bash skills/controlling-costs/scripts/test-ast-parser
