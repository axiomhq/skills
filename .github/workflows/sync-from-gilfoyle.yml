name: Sync SRE from Gilfoyle

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-from-gilfoyle
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'axiomhq/skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skills
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout gilfoyle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: axiomhq/gilfoyle
          path: _gilfoyle
          persist-credentials: false

      - name: Check for new commits
        id: check
        run: |
          GILFOYLE_SHA=$(git -C _gilfoyle rev-parse HEAD)
          echo "source_sha=${GILFOYLE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          LAST_SYNCED=$(git log -1 --format=%s -- skills/sre/ | grep -oP '(?<=gilfoyle@)[a-f0-9]+' || echo "")
          if [[ "${GILFOYLE_SHA:0:7}" == "$LAST_SYNCED" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already synced to gilfoyle@${GILFOYLE_SHA:0:7}"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "New commits: last synced $LAST_SYNCED, gilfoyle at ${GILFOYLE_SHA:0:7}"
          fi

      - name: Run sync
        if: steps.check.outputs.skip != 'true'
        run: _gilfoyle/scripts/sync-to-skills skills/sre

      - name: Run tests
        if: steps.check.outputs.skip != 'true'
        run: _gilfoyle/scripts/test-build skills/sre

      - name: Verify no extra files from repo root
        if: steps.check.outputs.skip != 'true'
        run: |
          # Ensure no .meta, site, or other non-skill files leaked
          for dir in .meta site .github; do
            if [[ -d "skills/sre/$dir" ]]; then
              echo "ERROR: $dir should not be in synced output"
              exit 1
            fi
          done

      - name: Open sync PR
        if: steps.check.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: automation/sync-gilfoyle
          add-paths: skills/sre/
          commit-message: 'sre: sync from gilfoyle@${{ steps.check.outputs.source_sha }}'
          title: 'sre: sync from gilfoyle@${{ steps.check.outputs.source_sha }}'
          body: |
            Sync the SRE skill from axiomhq/gilfoyle. The upstream build tests passed.

            Approve workflows to run if GitHub requests it, then review and merge once CI passes.

      - name: Clean up
        if: always()
        run: rm -rf _gilfoyle
